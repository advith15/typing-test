<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>dig bick typelords</h1>
        <div class="timer">Time: <span id="timer">15</span>s</div>
        <div class="text-display" id="text-display">
            <!-- Random text will be inserted here -->
        </div>
        <textarea id="text-input" placeholder="Start typing here..."></textarea>
        <div class="stats">
            <span>WPM: <span id="wpm">0</span></span>
            <span>Accuracy: <span id="accuracy">100%</span></span>
        </div>
        <button id="restart-btn">Restart</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
