<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Javascript Code</h1>
    <button id="start">start</button><br>
    <button id="stop">stop</button>
</body>
<script>
    const startTimer = document.getElementById('start');
    const stopTimer = document.getElementById('stop');
    
    const sayDate = function(){
            console.log("date is ",Date.now().toLocaleString());
        }

    let interval;
    start.addEventListener('click',(e)=>{
        interval = setInterval(sayDate,1000)
        console.log(interval)
        
    })
    stopTimer.addEventListener('click',(e)=>{
        clearInterval(interval)
    })


</script>
</html>
